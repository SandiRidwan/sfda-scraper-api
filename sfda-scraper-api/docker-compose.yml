version: '3.8'

services:
  sfda-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfda-scraper-api
    restart: unless-stopped
    
    ports:
      - "8000:8000"
    
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      APP_DEBUG: "false"
    
    env_file: .env
    
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks: {}